<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coin kartı · Botlar</title>
<style>
/* V1.19.0: ayrı pencerede coin kartı (piyasa özetindeki ⧉ ile açılır). Tema workspace.css ile aynı renkler. */
:root { --bg: #141617; --panel: #1a1d1f; --panel2: #222628; --line: #35393b; --tx: #eeebe5; --mut: #b2aba0; --acc: #dda479; --up: #73d5a5; --dn: #ff8990; --warn: #edc36d; --mono: "Cascadia Mono", "Consolas", monospace; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--tx); font: 13px "Segoe UI", "Bahnschrift", system-ui, sans-serif; }
main { display: grid; gap: 8px; padding: 10px; }
header { display: flex; align-items: baseline; gap: 8px; }
.cn { font-weight: 700; font-size: 16px; }
.cn small { color: var(--mut); font-weight: 500; font-size: 11px; }
.px { margin-left: auto; font: 700 16px var(--mono); }
.ccb { padding: 8px 10px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel2); }
.ccl { margin-bottom: 6px; font-size: 12px; font-weight: 700; letter-spacing: .05em; }
.ccr { display: grid; grid-template-columns: auto minmax(30px, 1fr) auto; align-items: center; gap: 7px; font: 12px var(--mono); white-space: nowrap; }
.ccr .up { color: var(--up); } .ccr .dn { color: var(--dn); text-align: right; }
.cct { display: flex; height: 7px; border-radius: 4px; overflow: hidden; background: var(--line); }
.cct i { display: block; height: 100%; } .cct i:first-child { background: var(--up); } .cct i:last-child { background: var(--dn); }
.nt { color: var(--mut); font-size: 11px; text-align: right; }
.err { color: var(--warn); font-size: 12px; }
button { font: inherit; color: var(--tx); background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 3px 8px; cursor: pointer; }
button:hover { border-color: var(--acc); }
#izinb { white-space: nowrap; }
#izin { display: none; justify-content: space-between; align-items: center; gap: 8px; color: var(--mut); font-size: 11px; }
</style>
</head>
<body>
<main>
  <header><div class="cn" id="cn">—</div><div class="px" id="px">—</div></header>
  <div id="bars"></div>
  <div class="nt" id="nt"></div>
  <div class="err" id="err" role="status"></div>
  <div id="izin"><span>Pencere bir dahaki sefere ikinci ekranda açılsın mı? Tarayıcı bunun için izin ister.</span><button id="izinb" type="button">İzin ver</button></div>
</main>
<script>
'use strict';
// Ana terminal sayfası coin değiştirince BroadcastChannel ile haber verir; pencere kendi verisini kendi çeker:
// /api/t/ozet (emir defteri, 15 sn), /api/t/oranlar (üç long/short oranı, 60 sn; sunucuda 5 dk önbellek), /api/t/coin (mark fiyat, 10 sn).
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const isN = v => typeof v === 'number' && Number.isFinite(v);
const clean = v => { const s = String(v || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); return s.length >= 2 && s.length <= 30 ? s : null; };
const short = s => s.replace(/(USDT|USDC)$/, '');
const store = { get(k, d) { try { const v = localStorage.getItem('v1.t.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem('v1.t.' + k, JSON.stringify(v)); } catch (e) { } } };
const fmtPx = v => { if (!isN(v)) return '—'; const a = Math.abs(v), d = a >= 1000 ? 2 : a >= 1 ? 4 : a >= 0.01 ? 5 : 8; return v.toFixed(d); };
const p2 = n => String(n).padStart(2, '0');
let sym = clean(new URLSearchParams(location.search).get('s')) || clean(store.get('sym', null)), gen = 0;
const D = { ob: null, son: null, mark: null, err: '' };
async function api(u) { const r = await fetch(u, { headers: { accept: 'application/json' } }); const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || 'HTTP ' + r.status); return j; }
function bar(lab, v, a, b, tip) {
  const ok = isN(v), L = ok ? Math.min(100, Math.max(0, v)) : 50;
  return `<div class="ccb" title="${esc(tip)}"><div class="ccl">${lab}</div><div class="ccr"><span class="up">${ok ? a + ' ' + L.toFixed(2) + '%' : '—'}</span>`
    + `<div class="cct" role="img" aria-label="${esc(lab)}: ${ok ? a + ' ' + L.toFixed(2) + '%, ' + b + ' ' + (100 - L).toFixed(2) + '%' : 'veri yok'}"><i style="width:${ok ? L : 0}%"></i><i style="width:${ok ? 100 - L : 0}%"></i></div>`
    + `<span class="dn">${ok ? (100 - L).toFixed(2) + '% ' + b : ''}</span></div></div>`;
}
function render() {
  if (!sym) { $('#cn').textContent = 'Coin seçilmedi'; $('#bars').innerHTML = ''; return; }
  document.title = `${short(sym)} · Coin kartı`;
  $('#cn').innerHTML = `${esc(short(sym))}<small>/USDT.P</small>`; $('#px').textContent = fmtPx(D.mark);
  const ob = D.ob, o = D.son, obb = ob && ob.bid + ob.ask > 0 ? ob.bid / (ob.bid + ob.ask) * 100 : NaN, ot = o && o.t ? new Date(o.t + 3 * 3600e3) : null;
  $('#bars').innerHTML = bar('EMİR DEFTERİ', obb, 'B', 'S', 'İlk 100 kademedeki alış (B) / satış (S) emirlerinin tutar payı · 15 sn')
    + bar('LONG/SHORT POZİSYONLAR', o && o.pos, 'L', 'S', 'Büyük hesapların pozisyon büyüklüğüne göre long oranı (topLongShortPositionRatio)')
    + bar('TRADER POSITIONING', o && o.top, 'L', 'S', 'Büyük hesapların hesap sayısına göre long oranı (topLongShortAccountRatio)')
    + bar('MARKET EXPOSURE', o && o.glob, 'L', 'S', 'Tüm hesapların hesap sayısına göre long oranı (globalLongShortAccountRatio)');
  $('#nt').textContent = (o ? 'oranlar 5 dk' + (ot ? ` (son ${p2(ot.getUTCHours())}:${p2(ot.getUTCMinutes())})` : '') : 'oranlar yükleniyor…') + ' · emir defteri 15 sn';
  $('#err').textContent = D.err;
}
const TASKS = [
  { ms: 15e3, fn: async (s, g) => { const o = await api(`/api/t/ozet?symbol=${s}`); if (g === gen) D.ob = o; } },
  { ms: 60e3, fn: async (s, g) => { const o = await api(`/api/t/oranlar?symbol=${s}`); if (g === gen) D.son = o.son; } },
  { ms: 10e3, fn: async (s, g) => { const o = await api(`/api/t/coin?symbol=${s}`); if (g === gen) D.mark = o.mark; } },
].map(t => Object.assign(t, { next: 0, busy: false }));
function loop() {
  if (!sym) return; const now = Date.now(), s = sym, g = gen;
  for (const t of TASKS) if (now >= t.next && !t.busy) {
    t.next = now + t.ms; t.busy = true;
    t.fn(s, g).then(() => { if (g === gen) D.err = ''; }, e => { if (g === gen) D.err = 'Veri alınamadı: ' + e.message; }).finally(() => { t.busy = false; if (g === gen) render(); });
  }
}
function setSym(s) { s = clean(s); if (!s || s === sym) return; sym = s; gen++; D.ob = D.son = D.mark = null; D.err = ''; for (const t of TASKS) t.next = 0; render(); loop(); }
try { new BroadcastChannel('v1-terminal').onmessage = e => { if (e.data && e.data.sym) setSym(e.data.sym); }; } catch (e) { }
// pencerenin yeri ve boyutu hatırlanır; ana sayfa bir dahaki açılışta aynı yere açar
let lastPos = '';
function savePos() { const p = { x: window.screenX, y: window.screenY, w: window.outerWidth, h: window.outerHeight }, k = JSON.stringify(p); if (k !== lastPos && p.w > 100) { lastPos = k; store.set('kartWin', p); } }
setInterval(savePos, 2000); window.addEventListener('pagehide', savePos);
// ikinci ekranda açabilmek için tarayıcının "pencere yönetimi" izni gerekir (Chrome/Edge); izin yoksa pencere ana ekranla sınırlanır
(async () => {
  if (!('getScreenDetails' in window) || !navigator.permissions) return;
  let st; try { st = await navigator.permissions.query({ name: 'window-management' }); } catch (e) { return; }
  const show = () => { $('#izin').style.display = st.state === 'granted' ? 'none' : 'flex'; }; show(); st.onchange = show;
  $('#izinb').onclick = async () => { try { await window.getScreenDetails(); } catch (e) { } show(); };
})();
render(); loop(); setInterval(loop, 1000);
</script>
</body>
</html>
