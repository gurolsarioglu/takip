<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Botlar · Terminal</title>
<!-- Botlar V1 — Terminal: izleme listesi + yan yana 4 dik mum grafiği (altında RSI, Stokastik RSI, WaveTrend) + OI/hacim paneli. Tek dosya, dış betik/stil/CDN yok; grafikler kendi canvas kodumuz.
     Bütün veri web/terminal.cjs'nin /api/t/* uçlarından gelir (tarayıcı Binance'e bağlanmaz). Açılış: http://localhost:3200/terminal.html[?s=SEMBOL] -->
<style>
:root{--bg:#0b0f17;--panel:#121826;--panel2:#171f30;--line:#232c40;--tx:#e6ebf5;--mut:#8a94a8;--up:#1fc77e;--dn:#f6465d;--acc:#3b82f6;--warn:#f0b90b}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:7px 14px;border-bottom:1px solid var(--line);background:var(--panel);flex:0 0 auto;min-height:44px;flex-wrap:nowrap;overflow:hidden}
.logo{font-weight:700;font-size:16px;letter-spacing:.2px;color:var(--tx);text-decoration:none}
.ver{font-size:11px;color:var(--mut);border:1px solid var(--line);border-radius:10px;padding:1px 8px}
.ttl{font-weight:600;color:var(--mut)}
.sp{flex:1}
input,button,select{font:inherit;color:var(--tx);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 9px}
button,select{cursor:pointer}button.on{border-color:var(--acc);color:#fff;background:#1d2b4d}
a.btn{font-size:13px;color:var(--tx);text-decoration:none;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 10px;white-space:nowrap}
a.btn:hover,button:hover{border-color:#2b3c66}
.sum{display:flex;align-items:baseline;gap:14px;font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;min-width:0}
.sum b{color:var(--tx);font-weight:600;font-variant-numeric:tabular-nums}.sum .sy{font-size:16px;font-weight:700;color:var(--tx)}
.sum .pxl{font-size:16px;font-weight:700;color:var(--tx);font-variant-numeric:tabular-nums}
.up{color:var(--up)!important}.dn{color:var(--dn)!important}
.warn{font-size:12px;color:#1a1300;background:var(--warn);border-radius:6px;padding:2px 8px;white-space:nowrap;font-weight:600}
.wrap{flex:1;min-height:0;display:grid;grid-template-columns:290px 1fr}
aside{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.addb{position:relative;padding:8px 8px 4px}
.addb input{width:100%}
.sugg{position:absolute;left:8px;right:8px;top:calc(100% - 2px);background:var(--panel2);border:1px solid #2b3c66;border-radius:8px;z-index:30;display:none;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.sugg.open{display:block}
.sugg div{padding:5px 10px;font-size:13px;cursor:pointer;display:flex;gap:8px}.sugg div.on,.sugg div:hover{background:#1d2b4d}
.sugg small{color:var(--mut);margin-left:auto}.sugg .nt{color:var(--mut);cursor:default}
.aerr{color:var(--dn);font-size:12px;padding:0 10px;min-height:0}
.lh,.row{display:grid;grid-template-columns:1fr 78px 54px 46px 16px;gap:4px;align-items:center;padding:0 8px 0 10px}
.lh{font-size:11px;color:var(--mut);padding-top:4px;padding-bottom:4px;border-bottom:1px solid var(--line);user-select:none}
.lh span{cursor:pointer;white-space:nowrap}.lh span:hover{color:var(--tx)}.lh .n{text-align:right}
.wl{flex:1;overflow:auto;min-height:0}
.row{height:30px;font-size:12.5px;cursor:pointer;border-left:3px solid transparent;font-variant-numeric:tabular-nums}
.row:hover{background:var(--panel2)}.row.sel{background:#1a2440;border-left-color:var(--acc)}
.row .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row .n{text-align:right;white-space:nowrap;overflow:hidden}
.row .x{background:none;border:0;padding:0;color:var(--mut);font-size:12px;visibility:hidden;cursor:pointer}.row:hover .x{visibility:visible}.row .x:hover{color:var(--dn)}
.row .nm{display:flex;align-items:center;gap:4px;min-width:0}.row .nm i{font-style:normal;overflow:hidden;text-overflow:ellipsis;min-width:0}.row.dl .nm i{color:var(--dn)}
.bd{font-size:9.5px;font-weight:700;border-radius:4px;padding:0 3px;line-height:15px;flex:0 0 auto;letter-spacing:.2px;cursor:help}
.bd.dl{background:var(--dn);color:#fff}.bd.nw{background:#1d4ed8;color:#fff}.bd.go{background:#5b6478;color:#fff}
.row .st{background:none;border:0;padding:0;font-size:13px;color:#4b556d;cursor:pointer}.row .st.on{color:var(--warn)}.row .st:hover{color:var(--tx)}
.modes{display:flex;gap:4px;padding:2px 8px 6px}.modes button{flex:1;font-size:12px;padding:3px 6px}
.linfo{font-size:11px;color:var(--mut);padding:0 10px 5px;display:flex;gap:8px;align-items:center;min-height:0}.linfo .chip{cursor:pointer;color:var(--dn);font-weight:600}.linfo .chip.on{background:var(--dn);color:#fff;border-radius:4px;padding:0 5px}
.row.tmp{border-left-color:var(--warn)}.row .plus{grid-column:2/6;justify-self:end;font-size:11px;padding:2px 7px;border-radius:6px}
.lnote{font-size:12px;color:var(--mut);padding:10px;line-height:1.5}.lnote.bad{color:var(--warn)}
main{display:flex;flex-direction:column;min-width:0;min-height:0;padding:6px 8px 8px;gap:6px}
.tb{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut);flex:0 0 auto}
.tb button{font-size:12px;padding:3px 9px}
.tb label{display:flex;align-items:center;gap:4px;cursor:pointer;user-select:none}.tb label input{margin:0}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:minmax(0,1fr);gap:6px}
.grid.max{grid-template-columns:1fr;grid-template-rows:1fr}.grid.max .pane:not(.max){display:none}
.pane,.oip{background:var(--panel);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.ph{display:flex;align-items:center;gap:8px;padding:3px 6px;border-bottom:1px solid #1b2335;font-size:11.5px;color:var(--mut);white-space:nowrap;overflow:hidden;flex:0 0 auto;min-height:27px;user-select:none}
.ph select{font-size:12px;padding:1px 4px;border-radius:6px}
.ph .info{overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}.ph .info b{color:var(--tx);font-weight:500}
.ph .hint{margin-left:auto;opacity:.5;font-size:10.5px}
.cv{flex:1;position:relative;min-height:0}.cv canvas{position:absolute;left:0;top:0;display:block;cursor:crosshair}
.cv canvas.drag{cursor:grabbing}
.oip{flex:0 0 160px}
.per button{font-size:11px;padding:1px 7px;border-radius:6px}
.oist{margin-left:auto;font-variant-numeric:tabular-nums}.oist b{color:var(--tx);font-weight:600}
.oinote{opacity:.6;font-size:10.5px}
.tip{position:fixed;z-index:50;pointer-events:none;background:rgba(18,24,38,.96);border:1px solid #2b3c66;border-radius:8px;padding:6px 9px;font-size:12px;line-height:1.5;display:none;max-width:340px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.tip .m{color:var(--mut)}
.dd{position:relative}.ddm{position:absolute;left:0;top:calc(100% + 4px);z-index:40;display:none;background:var(--panel2);border:1px solid #2b3c66;border-radius:8px;padding:6px 4px;min-width:250px;box-shadow:0 10px 30px rgba(0,0,0,.55)}
.ddm.open{display:block}.ddm label{padding:4px 8px;border-radius:6px;color:var(--tx);font-size:12.5px;white-space:nowrap}.ddm label:hover{background:#1d2b4d}.ddm label small{color:var(--mut);margin-left:auto;padding-left:12px}
.ddm .ddf{display:flex;gap:6px;padding:6px 8px 2px;border-top:1px solid var(--line);margin-top:4px}
/* piyasa özeti (listenin altı) */
.oz{flex:0 0 auto;border-top:1px solid var(--line);padding:8px 10px 9px;font-size:12px;background:var(--panel)}
.oz .t1{display:flex;align-items:flex-start;gap:8px}.oz .cn{font-weight:700;font-size:13px}.oz .cn small{color:var(--mut);font-weight:500}
.oz .bp{font-size:24px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}.oz .fr{margin-left:auto;text-align:right;color:var(--mut);font-size:11px;line-height:1.35}
.oz .fr b{display:block;color:var(--tx);font-size:15px;font-variant-numeric:tabular-nums}.oz .fr span{border:1px solid var(--line);border-radius:5px;padding:0 5px;font-variant-numeric:tabular-nums}
.oz .ln{display:flex;justify-content:space-between;margin-top:6px;color:var(--mut)}.oz .ln b{color:var(--tx);font-variant-numeric:tabular-nums}
.oz .br{display:grid;grid-template-columns:96px 1fr;align-items:center;gap:6px;margin-top:5px;color:var(--mut);font-size:11px}
.oz .bar{display:flex;height:17px;border-radius:4px;overflow:hidden;font-size:10.5px;font-weight:600;font-variant-numeric:tabular-nums;background:#1b2335}
.oz .bar i{font-style:normal;display:flex;align-items:center;padding:0 5px;white-space:nowrap;overflow:hidden}.oz .bar .l{background:rgba(31,199,126,.32);color:#c9f5df}.oz .bar .s{background:rgba(246,70,93,.32);color:#ffd5db;justify-content:flex-end}
.oz .nt{color:var(--mut);font-size:10.5px;margin-top:5px;opacity:.75}
@media (max-height:820px){.oz .bp{font-size:19px}.oz .br{margin-top:3px}}
@media (max-width:1250px){.sum .opt{display:none}}
@media (max-width:1700px){.tb .hint2{display:none}}
</style>
</head>
<body>
<header>
  <a class="logo" href="/">Botlar</a><span class="ver" id="ver">V1</span><span class="ttl">Terminal</span>
  <a class="btn" href="/">← Sinyaller</a>
  <div class="sum" id="sum"></div>
  <span class="sp"></span>
  <span class="warn" id="warn" style="display:none"></span>
</header>
<div class="wrap">
  <aside>
    <div class="addb"><input id="addq" placeholder="Coin ekle (ör. SOL)" autocomplete="off" spellcheck="false"><div class="sugg" id="sugg"></div></div>
    <div class="modes"><button data-mode="all">Tümü</button><button data-mode="mine">Listem</button></div>
    <div class="linfo" id="linfo"></div>
    <div class="aerr" id="aerr"></div>
    <div class="lh"><span data-sort="sym">İZLEME</span><span class="n" data-sort="px">Fiyat</span><span class="n" data-sort="chg">24s %</span><span class="n" data-sort="vol">Hacim</span><span></span></div>
    <div class="wl" id="wl"></div>
    <div class="oz" id="oz"></div>
  </aside>
  <main>
    <div class="tb">
      <button data-lay="kisa" title="5dk · 15dk · 1s · 4s">Kısa: 5dk·15dk·1s·4s</button><button data-lay="uzun" title="4s · 1g · 1h · 1ay">Uzun: 4s·1g·1h·1ay</button>
      <div class="dd"><button id="tcb" title="Trader Club klonları (5in1 + S/R): grafikte hangilerinin görüneceğini seç">TC göstergeleri ▾</button><div class="ddm" id="tcm"></div></div>
      <span class="sp"></span>
      <span class="hint2" style="opacity:.7">tekerlek: yakınlaştır · sürükle: kaydır · çift tık: sıfırla · başlığa çift tık: büyüt · saatler TR</span>
      <div class="dd"><button id="pnb" title="Her grafiğin altındaki bölmeler">Alt paneller ▾</button><div class="ddm" id="pnm"></div></div>
      <label title="Seçili coinin son 48 saatteki bot sinyalleri"><input type="checkbox" id="sigOn"> Sinyal işaretleri</label>
      <label title="M1 ve M1 Premium çok sık sinyal verir; varsayılan olarak gösterilmez"><input type="checkbox" id="sigM1"> M1 dahil</label>
    </div>
    <div class="grid" id="grid"></div>
    <div class="oip" id="oip">
      <div class="ph"><b style="color:var(--tx)">OI ve hacim</b><span class="per" id="per"></span><span class="info" id="oiinfo"></span><span class="oist" id="oist"></span></div>
      <div class="cv"><canvas></canvas></div>
    </div>
  </main>
</div>
<div class="tip" id="tip"></div>
<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const COL = { up: css('--up') || '#1fc77e', dn: css('--dn') || '#f6465d', mut: css('--mut') || '#8a94a8', line: css('--line') || '#232c40', acc: css('--acc') || '#3b82f6', warn: css('--warn') || '#f0b90b', tx: css('--tx') || '#e6ebf5', grid: '#182033', cross: '#6b7a99', lab: '#2b3c66' };
const FONT = '11px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
const TFS = ['5m', '15m', '1h', '4h', '1d', '1w', '1M'], TFL = { '5m': '5dk', '15m': '15dk', '1h': '1s', '4h': '4s', '1d': '1g', '1w': '1h', '1M': '1ay' };
const IVMS = { '5m': 300e3, '15m': 900e3, '1h': 3600e3, '4h': 14400e3, '1d': 864e5, '1w': 7 * 864e5, '1M': 30 * 864e5 };
const LAYOUTS = { kisa: ['5m', '15m', '1h', '4h'], uzun: ['4h', '1d', '1w', '1M'] }, PERIODS = ['5m', '15m', '1h', '4h', '1d'];
const PANE_ORDER = ['rsi', 'srsi', 'wt', 'me', 'fr', 'oi', 'tp'];
const TR = 3 * 3600e3; // Türkiye saati sabit UTC+3 (yaz saati yok)
const cleanSym = v => { const s = String(v || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); return s.length >= 2 && s.length <= 30 ? s : null; };
const short = s => s.endsWith('USDT') && s.length > 4 ? s.slice(0, -4) : s;
const p2 = n => String(n).padStart(2, '0');
const trDate = t => new Date(t + TR);
function fmtT(t, iv, full) {
  const d = trDate(t), dm = `${p2(d.getUTCDate())}.${p2(d.getUTCMonth() + 1)}`;
  if (iv === '1M') return `${p2(d.getUTCMonth() + 1)}.${d.getUTCFullYear()}`;
  if (iv === '1d' || iv === '1w') return full ? `${dm}.${d.getUTCFullYear()}` : dm;
  return full ? `${dm}.${String(d.getUTCFullYear()).slice(2)} ${p2(d.getUTCHours())}:${p2(d.getUTCMinutes())}` : `${p2(d.getUTCHours())}:${p2(d.getUTCMinutes())}`;
}
// Fiyat: anlamlı basamak + gereksiz sıfır kırpma (0.00001234 bozulmaz)
function fmtPx(p) {
  if (p == null || !Number.isFinite(p)) return '—';
  if (p === 0) return '0';
  const a = Math.abs(p); let s = a >= 1e-7 ? p.toPrecision(a >= 1e5 ? 7 : 6) : p.toFixed(12);
  if (/e/i.test(s)) s = p.toFixed(12);
  if (s.includes('.')) s = s.replace(/0+$/, '').replace(/\.$/, '');
  return s;
}
function fmtBig(v, dig = 2) {
  if (v == null || !Number.isFinite(v)) return '—';
  const a = Math.abs(v), sg = v < 0 ? '−' : '';
  return sg + (a >= 1e12 ? (a / 1e12).toFixed(dig) + 'T' : a >= 1e9 ? (a / 1e9).toFixed(dig) + 'B' : a >= 1e6 ? (a / 1e6).toFixed(dig) + 'M' : a >= 1e3 ? (a / 1e3).toFixed(dig > 1 ? 1 : dig) + 'K' : a >= 10 ? a.toFixed(0) : a.toFixed(2));
}
const volM = v => { if (v == null || !Number.isFinite(v)) return '—'; const m = v / 1e6; return m >= 1000 ? (m / 1000).toFixed(1) + 'B' : m >= 10 ? m.toFixed(0) + 'M' : m.toFixed(1) + 'M'; }; // listede 24s hacim (M$)
const fmtPct = (v, d = 2) => v == null || !Number.isFinite(v) ? '—' : (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(d) + '%';
const pcls = v => v > 0 ? 'up' : v < 0 ? 'dn' : '';
function niceStep(range, n) {
  const raw = range / Math.max(1, n), mag = Math.pow(10, Math.floor(Math.log10(raw))), m = raw / mag;
  return (m < 1.5 ? 1 : m < 2.25 ? 2 : m < 3.5 ? 2.5 : m < 7.5 ? 5 : 10) * mag;
}
function decFor(step) {
  let d = Math.max(0, Math.ceil(-Math.log10(step) - 1e-9));
  while (d < 12 && Math.abs(Math.round(step * 10 ** d) - step * 10 ** d) > 1e-6 * 10 ** d * step) d++;
  return Math.min(12, d);
}
// d[i][0] <= T olan son indeks (yoksa -1)
function bsT(d, T) { let lo = 0, hi = d.length - 1, r = -1; while (lo <= hi) { const m = (lo + hi) >> 1; if (d[m][0] <= T) { r = m; lo = m + 1; } else hi = m - 1; } return r; }
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const store = { get(k, def) { try { const v = localStorage.getItem('v1.t.' + k); return v == null ? def : JSON.parse(v); } catch (e) { return def; } }, set(k, v) { try { localStorage.setItem('v1.t.' + k, JSON.stringify(v)); } catch (e) { } } };

// ---------- Göstergeler (lib/ind.cjs ile aynı hesap: Wilder RSI, Stoch RSI K/D, WaveTrend hlc3 + ilk değer tohumlu EMA) ----------
const isN = v => typeof v === 'number' && Number.isFinite(v);
const f1 = v => (Math.abs(v) < 0.05 ? 0 : v).toFixed(1);
const TA = {
  sma(src, n) { const out = new Array(src.length).fill(NaN); let sum = 0, cnt = 0; for (let i = 0; i < src.length; i++) { if (isN(src[i])) { sum += src[i]; cnt++; } if (i >= n) { const o = src[i - n]; if (isN(o)) { sum -= o; cnt--; } } if (i >= n - 1 && cnt === n) out[i] = sum / n; } return out; },
  ema(src, n) { const out = new Array(src.length).fill(NaN), a = 2 / (n + 1); let prev = NaN; for (let i = 0; i < src.length; i++) { const v = src[i]; if (!isN(v)) { if (isN(prev)) out[i] = prev; continue; } prev = isN(prev) ? a * v + (1 - a) * prev : v; out[i] = prev; } return out; },
  rma(src, n) { const out = new Array(src.length).fill(NaN); let prev = NaN, sum = 0, k = 0; for (let i = 0; i < src.length; i++) { const v = src[i]; if (!isN(v)) continue; if (!isN(prev)) { sum += v; if (++k === n) { prev = sum / n; out[i] = prev; } continue; } prev = (prev * (n - 1) + v) / n; out[i] = prev; } return out; },
  rsi(cl, n) { const up = [NaN], dn = [NaN]; for (let i = 1; i < cl.length; i++) { const d = cl[i] - cl[i - 1]; up.push(Math.max(d, 0)); dn.push(Math.max(-d, 0)); } const ru = this.rma(up, n), rd = this.rma(dn, n); return cl.map((_, i) => !isN(ru[i]) || !isN(rd[i]) ? NaN : rd[i] === 0 ? (ru[i] === 0 ? 50 : 100) : ru[i] === 0 ? 0 : 100 - 100 / (1 + ru[i] / rd[i])); },
  stochRsi(r, len, sk, sd) { const st = r.map((v, i) => { if (i < len - 1) return NaN; let lo = Infinity, hi = -Infinity; for (let j = i - len + 1; j <= i; j++) { if (!isN(r[j])) return NaN; if (r[j] < lo) lo = r[j]; if (r[j] > hi) hi = r[j]; } return hi - lo === 0 ? 0 : 100 * (v - lo) / (hi - lo); }); const k = this.sma(st, sk); return { k, d: this.sma(k, sd) }; },
  emaS(src, n) { const out = new Array(src.length).fill(NaN), a = 2 / (n + 1); let prev = NaN, sum = 0, k = 0; for (let i = 0; i < src.length; i++) { const v = src[i]; if (!isN(v)) { if (isN(prev)) out[i] = prev; continue; } if (!isN(prev)) { sum += v; if (++k === n) { prev = sum / n; out[i] = prev; } continue; } prev = a * v + (1 - a) * prev; out[i] = prev; } return out; },
  wma(src, n) { const out = new Array(src.length).fill(NaN), den = n * (n + 1) / 2; for (let i = n - 1; i < src.length; i++) { let q = 0; for (let k = 0; k < n; k++) q += src[i - k] * (n - k); out[i] = q / den; } return out; },
  // TC Buy/Sell = Range Filter (parity/research/tc/rflib.cjs ile aynı): sig[i] 1 = Buy, -1 = Sell
  rangeFilter(src, per, mult) {
    const n = src.length, dd = src.map((v, i) => (i ? Math.abs(v - src[i - 1]) : 0)), sm = this.emaS(this.emaS(dd, per), per * 2 - 1), filt = new Array(n).fill(NaN), sig = new Int8Array(n);
    for (let i = 0; i < n; i++) { const p = i ? filt[i - 1] : src[i], r = sm[i] * mult, x = src[i]; filt[i] = !isN(r) ? x : x > p ? (x - r < p ? p : x - r) : (x + r > p ? p : x + r); }
    let up = 0, dn = 0, cond = 0, last = -1;

async function api(url, opt) {
  let r; try { r = await fetch(url, { cache: 'no-store', ...(opt || {}) }); } catch (e) { const x = new Error('Web sunucusuna ulaşılamıyor'); x.status = 0; throw x; }
  let b = null; try { b = await r.json(); } catch (e) { }
  if (!r.ok) { const x = new Error((b && b.error) || 'HTTP ' + r.status); x.status = r.status; x.retryAfter = b && b.retryAfter; if (x.retryAfter) pauseFor(x.retryAfter); throw x; }
  return b;
}
const errText = e => e.retryAfter ? 'Binance sınırı — süre dolunca yeniden denenecek' : e.message;

// ---------- Grafik bölmeleri ----------
const P = [];
function buildPanes() {
  const g = $('#grid');
  for (let i = 0; i < 4; i++) {
    const el = document.createElement('div'); el.className = 'pane'; el.dataset.i = i;
    el.innerHTML = `<div class="ph" title="Çift tık: bu grafiği büyüt / geri al"><select>${TFS.map(t => `<option value="${t}">${TFL[t]}</option>`).join('')}</select><span class="info"></span></div><div class="cv"><canvas></canvas></div>`;
    g.appendChild(el);
    const p = { i, el, tf: S.tfs[i], tnext: 0, tbusy: false, gen: 0, busy: false, loaded: false, next: 0, oldBusy: false, oldDone: false };
    p.ch = new Chart(el.querySelector('.cv'), { kind: 'candle', iv: p.tf, infoEl: el.querySelector('.info'), onView: ch => { if (ch.g && ch.view.r - ch.view.w < 40) chartOld(p); } });
    p.ch.panes = S.panes; p.ch.tc = S.tc;
    const sel = el.querySelector('select'); sel.value = p.tf;
    sel.onchange = () => { setTf(p, sel.value); renderLay(); };
    el.querySelector('.ph').addEventListener('dblclick', e => { if (e.target.tagName === 'SELECT') return; S.max = S.max === i ? -1 : i; g.classList.toggle('max', S.max >= 0); P.forEach(q => q.el.classList.toggle('max', q.i === S.max)); });
    P.push(p);
  }
}
function setTf(p, tf) {
  p.tf = tf; S.tfs[p.i] = tf; store.set('tfs', S.tfs); p.el.querySelector('select').value = tf;
  p.ch.iv = tf; p.loaded = false; p.gen++; p.busy = false; p.oldDone = p.ch.oldDone = false; p.oldBusy = false; p.ch.loadingOld = false; p.ch.err = ''; p.ch.msg = 'Yükleniyor…'; p.ch.signals = curSigs(); p.ch.setData([]); p.ch.ext = null; p.tnext = 0; p.next = 0; if (S.sym) chartFull(p);
}
async function chartFull(p) {
  if (!S.sym) return;
  const g = S.gen, pg = ++p.gen, sym = S.sym, tf = p.tf; p.busy = true; p.oldBusy = false; p.oldDone = false; p.ch.loadingOld = false; p.next = Date.now() + 5000;

  try {
    const rows = await api(`/api/t/klines?symbol=${sym}&interval=${tf}&limit=500`);
    if (g !== S.gen || pg !== p.gen) return;
    p.ch.err = ''; p.ch.msg = rows.length ? '' : 'Bu coin için veri yok'; p.ch.setData(rows); p.loaded = rows.length > 0; p.oldDone = p.ch.oldDone = rows.length < 500; renderSum();
  } catch (e) { if (g !== S.gen || pg !== p.gen) return; p.ch.err = errText(e); p.ch.requestDraw(); }
  finally { if (pg === p.gen) p.busy = false; }
}
async function chartLive(p) {
  const g = S.gen, pg = p.gen; p.busy = true;
  try {
    const rows = await api(`/api/t/klines?symbol=${S.sym}&interval=${p.tf}&limit=3`);
    if (g !== S.gen || pg !== p.gen) return;
    p.ch.err = ''; p.ch.merge(rows); if (p.i === 0 || p === fastest()) renderSum();
  } catch (e) { if (g !== S.gen || pg !== p.gen) return; p.ch.err = errText(e); p.ch.requestDraw(); }
  finally { if (pg === p.gen) p.busy = false; }
}
async function chartOld(p) {
  if (p.oldBusy || p.oldDone || !p.loaded || paused() || p.ch.data.length >= 20000) return;
  const g = S.gen, pg = p.gen, first = p.ch.data[0][0]; p.oldBusy = true; p.ch.loadingOld = true; p.ch.requestDraw();
  try {
    const rows = await api(`/api/t/klines?symbol=${S.sym}&interval=${p.tf}&limit=500&end=${first - 1}`);
    if (g !== S.gen || pg !== p.gen) return;
    const k = p.ch.prepend(rows); if (!k || rows.length < 500) p.oldDone = p.ch.oldDone = true; if (k) p.tnext = 0;
  } catch (e) { if (g !== S.gen || pg !== p.gen) return; p.ch.err = errText(e); }
  finally { if (pg === p.gen) { p.oldBusy = false; p.ch.loadingOld = false; p.ch.requestDraw(); } }
}
// alt panellerin türev verisi (Market Exposure, Funding, OI, Trader Positioning): grafik başına 5 dk'da bir

async function loadTurev(p) {
  if (!S.sym || !p.loaded || p.tbusy) return; const g = S.gen, pg = p.gen, from = p.ch.data[0][0]; p.tbusy = true; p.tnext = Date.now() + 300e3;
  try {
    const r = await api(`/api/t/turev?symbol=${S.sym}&tf=${p.tf}&from=${from}`); if (g !== S.gen || pg !== p.gen) return;
    if (r.retryAfter) pauseFor(r.retryAfter);
    p.ch.ext = { ls: r.ls, oi: r.oi, fr: r.fr, lsStep: r.lsStep, oiStep: r.oiStep, frIv: r.frIv, from }; p.ch.requestDraw();

  } catch (e) { if (g === S.gen && pg === p.gen) p.tnext = Date.now() + (e.retryAfter ? e.retryAfter * 1000 : 60e3); }

function renderList() {

  if (k) rows.sort((a, b) => { const va = k === 'sym' ? a.s : a.t ? a.t[k === 'px' ? 0 : k === 'chg' ? 1 : 2] : -Infinity, vb = k === 'sym' ? b.s : b.t ? b.t[k === 'px' ? 0 : k === 'chg' ? 1 : 2] : -Infinity; return (va < vb ? -1 : va > vb ? 1 : 0) * dir || a.i - b.i; });

    if (d) { const x = trDate(d), when = `${p2(x.getUTCDate())}.${p2(x.getUTCMonth() + 1)} ${p2(x.getUTCHours())}:${p2(x.getUTCMinutes())}`; return `<span class="bd dl" title="DELİST: Binance bu sözleşmeyi ${when} (TR) tarihinde kapatıyor; açık pozisyonlar o an otomatik kapatılır">⚠</span>`; }
    return u[2] && nowT - u[2] < 7 * 864e5 ? '<span class="bd nw" title="Son 7 günde listelendi">YENİ</span>' : ''; };
  if (all) {
    const keys = U ? Object.keys(U) : Object.keys(T), f = S.filt, dl = U ? keys.filter(s => U[s][1]) : [];
    let arr = keys.filter(s => (!f || s.includes(f)) && (!S.dlOnly || (U && U[s][1]))).map((s, i) => ({ s, i, t: T[s] }));
    const kk = k || 'chg', dd = k ? dir : -1, ix = kk === 'px' ? 0 : kk === 'chg' ? 1 : 2;
    arr.sort((a, b) => { const va = kk === 'sym' ? a.s : a.t && a.t[ix] != null ? a.t[ix] : -Infinity, vb = kk === 'sym' ? b.s : b.t && b.t[ix] != null ? b.t[ix] : -Infinity; return (va < vb ? -1 : va > vb ? 1 : 0) * dd || (a.s < b.s ? -1 : 1); });
    S.shown = arr.map(r => r.s);
    const inList = new Set(S.list);
    $('#wl').innerHTML = (S.uniErr && !U ? `<div class="lnote bad">Coin listesi alınamadı: ${esc(S.uniErr)}<br>Fiyat listesindeki coinler gösteriliyor; delist bilgisi yok.</div>` : '')
      + arr.map(({ s, t }) => `<div class="row ${s === S.sym ? 'sel' : ''} ${U && U[s] && U[s][1] ? 'dl' : ''}" data-s="${esc(s)}" title="${esc(s)}"><span class="nm"><i>${esc(short(s))}</i>${badge(s)}</span><span class="n">${t ? fmtPx(t[0]) : '—'}</span><span class="n ${pcls(t && t[1])}">${t ? fmtPct(t[1]) : '—'}</span><span class="n" style="color:var(--mut)">${t ? volM(t[2]) : '—'}</span><button class="st ${inList.has(s) ? 'on' : ''}" data-star="${esc(s)}" title="${inList.has(s) ? 'Listemden çıkar' : 'Listeme ekle'}">${inList.has(s) ? '★' : '☆'}</button></div>`).join('')
      + (!arr.length ? `<div class="lnote">${keys.length ? 'Eşleşen coin yok.' : 'Coin listesi yükleniyor…'}</div>` : '') + (S.tickErr ? `<div class="lnote bad">Fiyatlar güncellenemedi: ${esc(S.tickErr)}</div>` : '');
    $('#linfo').innerHTML = `<span>${U ? S.uni.n : keys.length} coin${f || S.dlOnly ? ' · ' + arr.length + ' gösteriliyor' : ''}</span>` + (dl.length ? `<span class="chip ${S.dlOnly ? 'on' : ''}" id="dlchip" title="Yalnız delist olacakları göster / hepsini göster">⚠ ${dl.length} delist</span>` : '');
  } else {
  const dlMine = U ? S.list.filter(s => !U[s] || U[s][1]).length : 0;
  $('#linfo').innerHTML = `<span>${S.list.length} coin</span>` + (dlMine ? `<span style="color:var(--dn);font-weight:600">⚠ ${dlMine} delist / kalkmış</span>` : '');
  const row = (s, t, tmp) => `<div class="row ${s === S.sym ? 'sel' : ''} ${tmp ? 'tmp' : ''} ${U && (!U[s] || U[s][1]) ? 'dl' : ''}" data-s="${esc(s)}" title="${esc(s)}"><span class="nm"><i>${esc(short(s))}</i>${badge(s)}</span>`
    + (tmp ? `${S.listOk ? `<button class="plus" data-add="${esc(s)}">+ listeye ekle</button>` : '<span class="n" style="grid-column:2/6;color:var(--mut)">listede değil</span>'}`
      : `<span class="n">${t ? fmtPx(t[0]) : '—'}</span><span class="n ${pcls(t && t[1])}">${t ? fmtPct(t[1]) : '—'}</span><span class="n" style="color:var(--mut)">${t ? volM(t[2]) : '—'}</span><button class="x" data-x="${esc(s)}" title="Listeden çıkar">✕</button>`) + '</div>';
  let h = '';
  if (S.listErr) h += `<div class="lnote bad">⚠ ${esc(S.listErr)}<br>Grafikler çalışmaya devam eder; yalnız seçili coin gösteriliyor.</div>`;
  if (S.sym && !S.list.includes(S.sym)) h += row(S.sym, T[S.sym], true);
  h += rows.map(r => row(r.s, r.t, false)).join('');
  if (S.listOk && !S.list.length) h += '<div class="lnote">Liste boş. Yukarıdaki kutuya coin adı yazıp ekleyin.</div>';
  if (S.tickErr) h += `<div class="lnote bad">Fiyatlar güncellenemedi: ${esc(S.tickErr)}</div>`;
  $('#wl').innerHTML = h;
  }
  document.querySelectorAll('[data-mode]').forEach(b => { b.classList.toggle('on', b.dataset.mode === S.mode); b.textContent = b.dataset.mode === 'all' ? `Tümü${U ? ' (' + S.uni.n + ')' : ''}` : `Listem (${S.list.length})`; });
  $('#addq').placeholder = all ? 'Coin ara (ör. SOL)' : 'Coin ekle (ör. SOL)';
  document.querySelectorAll('.lh [data-sort]').forEach(e => { const on = S.sort.k === e.dataset.sort; e.style.color = on ? 'var(--tx)' : ''; e.textContent = e.textContent.replace(/ [▲▼]$/, '') + (on ? (S.sort.dir > 0 ? ' ▲' : ' ▼') : ''); });
}
$('#wl').addEventListener('click', e => {
  const st = e.target.closest('[data-star]'); if (st) { e.stopPropagation(); listAct(S.list.includes(st.dataset.star) ? 'sil' : 'ekle', st.dataset.star); return; }
  const x = e.target.closest('[data-x]'); if (x) { e.stopPropagation(); listAct('sil', x.dataset.x); return; }
  const a = e.target.closest('[data-add]'); if (a) { e.stopPropagation(); listAct('ekle', a.dataset.add); return; }
  const r = e.target.closest('[data-s]'); if (r && r.dataset.s !== S.sym) select(r.dataset.s);
});
document.querySelectorAll('.lh [data-sort]').forEach(e => e.onclick = () => {
  const k = e.dataset.sort, first = k === 'sym' ? 1 : -1;
  if (S.sort.k !== k) S.sort = { k, dir: first }; else if (S.sort.dir === first) S.sort.dir = -first; else S.sort = { k: null, dir: 1 };
  renderList();
});
async function listAct(action, sym) {
  $('#aerr').textContent = '';
  try { S.list = await api('/api/t/izleme', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ action, symbol: sym }) }); S.listErr = ''; S.listOk = true; renderList(); return true; }
  catch (e) { $('#aerr').textContent = (action === 'ekle' ? 'Eklenemedi: ' : 'Çıkarılamadı: ') + e.message; return false; }
}
document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { S.mode = b.dataset.mode; store.set('mode', S.mode); S.filt = ''; S.dlOnly = false; $('#addq').value = ''; $('#sugg').classList.remove('open'); $('#wl').scrollTop = 0; renderList(); });
$('#linfo').addEventListener('click', e => { if (e.target.closest('#dlchip')) { S.dlOnly = !S.dlOnly; $('#wl').scrollTop = 0; renderList(); } });
// coin ekle kutusu ("Tümü" kipinde arama kutusu olarak çalışır)
const A = { items: [], sel: 0 };
function suggest() {
  const q = String($('#addq').value || '').toUpperCase().replace(/[^A-Z0-9]/g, ''), box = $('#sugg');
  if (S.mode === 'all') { box.classList.remove('open'); A.items = []; if (S.filt !== q) { S.filt = q; $('#wl').scrollTop = 0; renderList(); } return; }
  if (!q) { box.classList.remove('open'); A.items = []; return; }
  if (!S.tick) { A.items = []; box.innerHTML = `<div class="nt">${S.tickErr ? 'Sembol listesi alınamadı' : 'Sembol listesi yükleniyor…'} — Enter ile ${esc(q.endsWith('USDT') ? q : q + 'USDT')} denenir</div>`; box.classList.add('open'); return; }
  const keys = Object.keys(S.tick), qq = q.endsWith('USDT') && q.length > 4 ? q.slice(0, -4) : q;
  const pre = keys.filter(s => short(s).startsWith(qq)).sort((a, b) => a.length - b.length || a.localeCompare(b)), inc = keys.filter(s => !short(s).startsWith(qq) && s.includes(qq)).sort();
  A.items = pre.concat(inc).slice(0, 8); A.sel = 0;
  box.innerHTML = A.items.length ? A.items.map((s, i) => `<div data-i="${i}" class="${i === A.sel ? 'on' : ''}"><b>${esc(short(s))}</b><span style="color:var(--mut)">USDT</span><small>${S.list.includes(s) ? 'listede' : '$' + fmtBig(S.tick[s][2])}</small></div>`).join('') : '<div class="nt">Eşleşen Binance vadeli USDT sembolü yok</div>';
  box.classList.add('open');
}
async function addPick(s) {
  if (!s) return; $('#sugg').classList.remove('open'); $('#addq').value = ''; A.items = [];
  if (S.list.includes(s)) { select(s); return; }
  if (await listAct('ekle', s)) select(s);
}
$('#addq').addEventListener('input', suggest);
$('#addq').addEventListener('focus', suggest);
$('#addq').addEventListener('blur', () => setTimeout(() => $('#sugg').classList.remove('open'), 150));
$('#addq').addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { if (!A.items.length) return; e.preventDefault(); A.sel = (A.sel + (e.key === 'ArrowDown' ? 1 : -1) + A.items.length) % A.items.length; document.querySelectorAll('#sugg [data-i]').forEach(d => d.classList.toggle('on', +d.dataset.i === A.sel)); }
  else if (e.key === 'Enter' && S.mode === 'all') { e.preventDefault(); if (S.shown[0]) select(S.shown[0]); }
  else if (e.key === 'Escape' && S.mode === 'all') { $('#addq').value = ''; suggest(); }
  else if (e.key === 'Enter') { e.preventDefault(); const q = cleanSym($('#addq').value); addPick(A.items[A.sel] || (q ? (q.endsWith('USDT') ? q : q + 'USDT') : null)); }
  else if (e.key === 'Escape') { $('#addq').value = ''; $('#sugg').classList.remove('open'); }
});
$('#sugg').addEventListener('mousedown', e => { const d = e.target.closest('[data-i]'); if (d) { e.preventDefault(); addPick(A.items[+d.dataset.i]); } });

// ---------- Coin seçimi ve yoklama ----------
function select(sym) {
  sym = cleanSym(sym); if (!sym) return;
  S.sym = sym; S.gen++; store.set('sym', sym); S.coin = null; S.coinErr = ''; S.sigs = []; S.oiRows = [];
  document.title = `${short(sym)} · Botlar Terminal`;
  S.son = null; S.frIv = null; S.ob = null; for (const p of P) { p.loaded = false; p.busy = false; p.next = 0; p.tnext = 0; p.ch.ext = null; p.ch.predFr = null; p.ch.err = ''; p.ch.msg = 'Yükleniyor…'; p.ch.signals = []; p.ch.setData([]); }
  OI.err = ''; OI.msg = 'Yükleniyor…'; OI.setData([]); S.oiGen++;
  TASKS.coin.next = TASKS.oi.next = TASKS.sig.next = TASKS.ob.next = 0;
  renderList(); renderSum(); renderOiStats(); renderOz(); loop();
}
async function checkVer() { try { const v = await api('/api/version'); $('#ver').textContent = 'V' + v.version; if (S.stamp && S.stamp !== v.stamp) location.reload(); S.stamp = v.stamp; } catch (e) { } }
// Binance'e giden yoklamalar sınır beklemesinde ve sekme gizliyken durur; yerel uçlar (sinyal, sürüm) yalnız sekme gizliyken durur.
const TASKS = { coin: { ms: 10e3, fn: loadCoin, next: 0 }, tick: { ms: 20e3, fn: loadTickers, next: 0 }, oi: { ms: 60e3, fn: loadOi, next: 0 }, uni: { ms: 300e3, fn: loadUni, next: 0 }, ob: { ms: 15e3, fn: loadOb, next: 0 }, sig: { ms: 30e3, fn: loadSigs, next: 0, local: true }, ver: { ms: 10e3, fn: checkVer, next: 0, local: true }, list: { ms: 60e3, fn: loadList, next: 0, local: true } };
function loop() {
  renderWarn(); const cd = $('#cd'); if (cd) cd.textContent = cdText(S.coin && S.coin.nextFunding); const cd2 = $('#cd2'); if (cd2) cd2.textContent = cdText(S.coin && S.coin.nextFunding);
  if (document.hidden) return;
  const now = Date.now(), pz = paused();
  for (const t of Object.values(TASKS)) if (now >= t.next && !t.busy && (t.local || !pz)) { t.next = now + t.ms; t.busy = true; Promise.resolve().then(t.fn).catch(() => { }).finally(() => { t.busy = false; }); }
  if (!S.sym) return;
  for (const p of P) {
    if (pz) { if (!p.loaded && !p.busy) { p.ch.msg = 'Binance sınırı nedeniyle bekleniyor…'; p.ch.requestDraw(); } continue; }
    if (p.loaded && needTurev() && now >= p.tnext && !p.tbusy) loadTurev(p);
    if (p.busy || now < p.next) continue;
    p.next = now + 5000; if (p.loaded) chartLive(p); else chartFull(p);
  }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) { for (const t of Object.values(TASKS)) t.next = 0; for (const p of P) p.next = 0; loop(); } });
window.addEventListener('resize', () => { for (const c of HUB.charts) c.resize(); });

// ---------- Açılış ----------
buildPanes(); buildOi(); renderLay();
(async () => {
  let qs = null; try { qs = cleanSym(new URLSearchParams(location.search).get('s')); if (location.search) history.replaceState(null, '', location.pathname); } catch (e) { }
  loadBots();
  const first = qs || cleanSym(store.get('sym', null));
  if (first) select(first);
  TASKS.list.next = Date.now() + TASKS.list.ms; await loadList();
  if (!S.sym) select(S.list[0] || 'BTCUSDT');
  setInterval(loop, 1000); loop();
})();
</script>
</body>
