<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Botlar · Terminal</title>
<link rel="stylesheet" href="/workspace.css">
<link rel="stylesheet" href="/signal-panel.css">
<link rel="stylesheet" href="/terminal-ek.css">
</head>
<body>
<header class="workspace-top">
  <div class="brand"><a class="logo" href="/">Botlar</a><span class="ver" id="ver">V1</span><span class="ttl">Terminal</span></div>
  <a class="btn" href="/">← Sinyaller</a>
  <div class="sum" id="sum" role="group" aria-label="Seçili sözleşme ve piyasa verileri"></div>
  <span class="warn" id="warn" role="status" style="display:none"></span>
</header>
<div class="wrap" id="workspace">
  <main aria-label="Grafik çalışma alanı">
    <div class="tb" role="group" aria-label="Grafik ayarları">
      <span class="toolbar-label" title="Tekerlek: yakınlaştır · Sürükle: kaydır · Çift tık: sıfırla · Saatler TR">GRAFİKLER</span>
      <button data-lay="kisa" aria-label="Kısa: 5 dakika, 15 dakika, 1 saat, 4 saat" title="5dk · 15dk · 1s · 4s">Kısa</button><button data-lay="uzun" aria-label="Uzun: 4 saat, 1 gün, 1 hafta, 1 ay" title="4s · 1g · 1h · 1ay">Uzun</button>
      <div class="dd"><button id="tcb" aria-controls="tcm" aria-expanded="false" title="Fiyat grafiği üzerindeki çizimler: DEMA 9 ve Trader Club klonları (5in1 + S/R)">Katmanlar ▾</button><div class="ddm" id="tcm"></div></div>
      <div class="dd"><button id="pnb" aria-controls="pnm" aria-expanded="false" title="Her grafiğin altındaki bölmeler">Göstergeler<span aria-hidden="true"> ▾</span></button><div class="ddm" id="pnm"></div></div>
      <div class="tape" id="tape" title="Fareyi üstüne getirince durur"><div class="tape-in" id="tapeIn"></div><div class="tape-e" id="tapeE">Kayan yazı: coin seçilince canlı akış verisi toplanıyor…</div></div>
      <label class="toggle" title="Seçili coinin son 48 saatteki bot sinyalleri"><input type="checkbox" id="sigOn"> Sinyal işaretleri</label>
      <label class="toggle" title="M1 ve M1 Premium çok sık sinyal verir; varsayılan olarak gösterilmez"><input type="checkbox" id="sigM1"> M1 dahil</label>
    </div>
    <div class="grid" id="grid">
      <div class="splitter" data-split="0" role="separator" tabindex="0" aria-orientation="vertical" aria-controls="chart-1" aria-label="Grafik 1 ve 2 genişliği" title="Sürükle veya ok tuşlarını kullan; çift tıkla sıfırla"></div>
      <div class="splitter" data-split="1" role="separator" tabindex="0" aria-orientation="vertical" aria-controls="chart-2" aria-label="Grafik 2 ve 3 genişliği" title="Sürükle veya ok tuşlarını kullan; çift tıkla sıfırla"></div>
      <div class="splitter" data-split="2" role="separator" tabindex="0" aria-orientation="vertical" aria-controls="chart-3" aria-label="Grafik 3 ve 4 genişliği" title="Sürükle veya ok tuşlarını kullan; çift tıkla sıfırla"></div>
    </div>
    <div class="oip" id="oip">
      <div class="ph"><b style="color:var(--tx)">OI ve hacim</b><span class="per" id="per"></span><span class="info" id="oiinfo"></span><span class="oist" id="oist"></span></div>
      <div class="cv"><canvas></canvas></div>
    </div>
  </main>
  <div class="splitter" data-split="sidebar" role="separator" tabindex="0" aria-orientation="vertical" aria-controls="terminal-sidebar" aria-label="Kenar çubuğu genişliği" title="Sürükle veya ok tuşlarını kullan; çift tıkla sıfırla"></div>
  <aside class="sidebar" id="terminal-sidebar" aria-label="İzleme ve sinyaller">
    <section class="watchlist" id="watchlist" aria-labelledby="watchlist-title">
      <h2 class="rail-head" id="watchlist-title">İzleme listesi</h2>
      <div class="addb"><input id="addq" aria-label="Coin ara veya listeye ekle" placeholder="Coin ekle (ör. SOL)" autocomplete="off" spellcheck="false"><div class="sugg" id="sugg"></div></div>
      <div class="modes"><button data-mode="all">Tümü</button><button data-mode="mine">Listem</button><div class="dd"><button id="colb" aria-controls="colm" aria-expanded="false" title="Listede görünecek sütunlar">Sütunlar ▾</button><div class="ddm" id="colm"></div></div></div>
      <div class="linfo" id="linfo"></div>
      <div class="aerr" id="aerr" role="status"></div>
      <div class="lh" id="lh" role="group" aria-label="Sıralama"></div>
      <div class="wl" id="wl"></div>
    </section>
    <details class="coin-card" id="coin-card" open><summary class="rail-head" id="cc-head"><span lang="en">Coin</span> kartı</summary><div class="cc" id="cc"></div></details>
    <section id="signal-panel" aria-label="Bot sinyalleri">
      <h2 class="rail-head">Bot sinyalleri</h2>
      <p class="lnote">Sinyal paneli kullanılamıyor.</p>
    </section>
    <details class="market-summary" id="market-summary"><summary class="rail-head">Piyasa özeti</summary><div class="oz" id="oz"></div></details>
  </aside>
</div>
<div class="tip" id="tip"></div>
<script src="/indicator-engine.js"></script>
<script src="/terminal-indicators.js"></script>
<script src="/workspace.js"></script>
<script src="/signal-panel.js" id="signal-panel-script"></script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const COL = { up: css('--up') || '#73d5a5', dn: css('--dn') || '#ff8990', mut: css('--mut') || '#b2aba0', line: css('--line') || '#35393b', acc: css('--acc') || '#dda479', warn: css('--warn') || '#edc36d', tx: css('--tx') || '#eeebe5', grid: css('--chart-grid') || '#272b2d', cross: css('--chart-cross') || '#888078', lab: css('--chart-label') || '#464039' };
const FONT = '11px "Cascadia Mono",Consolas,monospace';
const TFS = ['5m', '15m', '1h', '4h', '1d', '1w', '1M'], TFL = { '5m': '5dk', '15m': '15dk', '1h': '1s', '4h': '4s', '1d': '1g', '1w': '1h', '1M': '1ay' };
const IVMS = { '5m': 300e3, '15m': 900e3, '1h': 3600e3, '4h': 14400e3, '1d': 864e5, '1w': 7 * 864e5, '1M': 30 * 864e5 };
const LAYOUTS = { kisa: ['5m', '15m', '1h', '4h'], uzun: ['4h', '1d', '1w', '1M'] }, PERIODS = ['5m', '15m', '1h', '4h', '1d'];
const { registry: indicatorRegistry } = globalThis.TerminalIndicators;
const INDICATOR_PANELS = new Map(indicatorRegistry.panels().map(({ id, panel }) => [id, panel]));
const PANE_ORDER = [...INDICATOR_PANELS.keys(), 'cvd', 'me', 'fr', 'oi', 'tp'];   // cvd: kendi çizimi olan panel (hesap motorda, bkz. terminal-indicators.js)
const TR = 3 * 3600e3; // Türkiye saati sabit UTC+3 (yaz saati yok)
const cleanSym = v => { const s = String(v || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); return s.length >= 2 && s.length <= 30 ? s : null; };
const short = s => s.endsWith('USDT') && s.length > 4 ? s.slice(0, -4) : s;
const p2 = n => String(n).padStart(2, '0');
const trDate = t => new Date(t + TR);
function fmtT(t, iv, full) {
  const d = trDate(t), dm = `${p2(d.getUTCDate())}.${p2(d.getUTCMonth() + 1)}`;
  if (iv === '1M') return `${p2(d.getUTCMonth() + 1)}.${d.getUTCFullYear()}`;
  if (iv === '1d' || iv === '1w') return full ? `${dm}.${d.getUTCFullYear()}` : dm;
  return full ? `${dm}.${String(d.getUTCFullYear()).slice(2)} ${p2(d.getUTCHours())}:${p2(d.getUTCMinutes())}` : `${p2(d.getUTCHours())}:${p2(d.getUTCMinutes())}`;
}
// Fiyat: anlamlı basamak + gereksiz sıfır kırpma (0.00001234 bozulmaz)
function fmtPx(p) {
  if (p == null || !Number.isFinite(p)) return '—';
  if (p === 0) return '0';
  const a = Math.abs(p); let s = a >= 1e-7 ? p.toPrecision(a >= 1e5 ? 7 : 6) : p.toFixed(12);
  if (/e/i.test(s)) s = p.toFixed(12);
  if (s.includes('.')) s = s.replace(/0+$/, '').replace(/\.$/, '');
  return s;
}
function fmtBig(v, dig = 2) {
  if (v == null || !Number.isFinite(v)) return '—';
  const a = Math.abs(v), sg = v < 0 ? '−' : '';
  return sg + (a >= 1e12 ? (a / 1e12).toFixed(dig) + 'T' : a >= 1e9 ? (a / 1e9).toFixed(dig) + 'B' : a >= 1e6 ? (a / 1e6).toFixed(dig) + 'M' : a >= 1e3 ? (a / 1e3).toFixed(dig > 1 ? 1 : dig) + 'K' : a >= 10 ? a.toFixed(0) : a.toFixed(2));
}
const volM = v => { if (v == null || !Number.isFinite(v)) return '—'; const m = v / 1e6; return m >= 1000 ? (m / 1000).toFixed(1) + 'B' : m >= 10 ? m.toFixed(0) + 'M' : m.toFixed(1) + 'M'; }; // listede 24s hacim (M$)
const fmtPct = (v, d = 2) => v == null || !Number.isFinite(v) ? '—' : (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(d) + '%';
const pcls = v => v > 0 ? 'up' : v < 0 ? 'dn' : '';
function niceStep(range, n) {
  const raw = range / Math.max(1, n), mag = Math.pow(10, Math.floor(Math.log10(raw))), m = raw / mag;
  return (m < 1.5 ? 1 : m < 2.25 ? 2 : m < 3.5 ? 2.5 : m < 7.5 ? 5 : 10) * mag;
}
function decFor(step) {
  let d = Math.max(0, Math.ceil(-Math.log10(step) - 1e-9));
  while (d < 12 && Math.abs(Math.round(step * 10 ** d) - step * 10 ** d) > 1e-6 * 10 ** d * step) d++;
  return Math.min(12, d);
}
// d[i][0] <= T olan son indeks (yoksa -1)
function bsT(d, T) { let lo = 0, hi = d.length - 1, r = -1; while (lo <= hi) { const m = (lo + hi) >> 1; if (d[m][0] <= T) { r = m; lo = m + 1; } else hi = m - 1; } return r; }
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const store = { get(k, def) { try { const v = localStorage.getItem('v1.t.' + k); return v == null ? def : JSON.parse(v); } catch (e) { return def; } }, set(k, v) { try { localStorage.setItem('v1.t.' + k, JSON.stringify(v)); } catch (e) { } } };

const isN = Number.isFinite;
const f1 = v => (Math.abs(v) < 0.05 ? 0 : v).toFixed(1);

function indicatorPanel(spec, result, i0, i1) {
  let lo, hi;
  if (Array.isArray(spec.range)) {
    [lo, hi] = spec.range;
  } else {
    lo = Infinity; hi = -Infinity;
    const include = value => { if (isN(value)) { lo = Math.min(lo, value); hi = Math.max(hi, value); } };
    spec.levels.forEach(include);
    for (const line of result?.series || []) for (let i = i0; i < i1; i++) include(line[i]);
    if (spec.range === 'symmetric') {
      const max = isN(hi) ? Math.max(Math.abs(lo), Math.abs(hi), 1) : 1;
      lo = -max * 1.12; hi = max * 1.12;
    } else if (!isN(hi)) {
      lo = 0; hi = 1;
    } else {
      const pad = (hi - lo) * 0.08 || Math.abs(hi) * 0.05 || 1;
      lo -= pad; hi += pad;
    }
  }
  const s = result ? result.series.map((values, i) => {
    const [color, text] = spec.colors[i];
    return [values, COL[color] || color, text];
  }) : [];
  return { nm: spec.title, kind: 'line', lo, hi, lv: spec.levels, band: spec.band, marks: result?.marks, s,
    head: result ? null : () => [['Hesaplanamadı', COL.mut]] };
}

// ---------- Ortak artı imleci ----------
const HUB = { t: null, src: null, charts: [], set(src, t) { if (this.t === t && this.src === src) return; this.t = t; this.src = src; for (const c of this.charts) if (c !== src) c.requestDraw(); } };
const tip = { el: null, owner: null, show(o, html, x, y) { const e = this.el || (this.el = $('#tip')); this.owner = o; e.innerHTML = html; e.style.display = 'block'; const w = e.offsetWidth, h = e.offsetHeight; e.style.left = Math.max(8, Math.min(innerWidth - w - 8, x + 14)) + 'px'; e.style.top = Math.max(4, Math.min(innerHeight - h - 8, y + 14)) + 'px'; }, hide(o) { if (this.el && (!o || this.owner === o)) { this.el.style.display = 'none'; this.owner = null; } } };

// ---------- Grafik bileşeni ----------
// kind 'candle': satır [t,o,h,l,c,qv] · kind 'oi': satır [t, adet, usd, qv, o, c]. Görünür aralık view = { r: sağ kenar (mum indeksi), w: genişlik (mum) } → [i0, i1)
// V1.18.0: alt panel yükseklikleri (px, panel anahtarına göre; 4 grafikte ortak, kalıcı). Boşsa varsayılan eşit dağılım.
const PANEH = store.get('paneh', {}) || {}, PMIN = 100, PHMIN = 24;
class Chart {
  constructor(wrap, o) {
    this.wrap = wrap; this.cv = wrap.querySelector('canvas'); this.ctx = this.cv.getContext('2d');
    this.kind = o.kind; this.iv = o.iv || '5m'; this.infoEl = o.infoEl; this.onView = o.onView || null;
    this.data = []; this.msg = 'Yükleniyor…'; this.err = ''; this.view = null; this.follow = true; this.signals = []; this.hits = []; this.loadingOld = false;
    this.panes = null; this.ext = null; this.predFr = null; this.tc = {}; this.W = 0; this.H = 0; this.dpr = 1; this.raf = 0; this.mouse = null; this.drag = null; this.g = null; this.aw = 0; this._info = null;
    this.indicators = this.kind === 'candle' ? indicatorRegistry.createSession() : null;
    HUB.charts.push(this);
    this.sizeDirty = false;
    if (window.ResizeObserver) new ResizeObserver(() => this.requestResize()).observe(wrap);
    const cv = this.cv;
    cv.addEventListener('wheel', e => this.onWheel(e), { passive: false });
    cv.addEventListener('mousedown', e => {
      if (e.button !== 0 || !this.g || !this.data.length) return;
      const z = this.zone(e.offsetX, e.offsetY);
      if (z && z.t === 'pane') { this.pdrag = { k: z.k, y: e.clientY, PH: this.g.PH.slice(), PL: this.g.PL.slice(), room: this.g.room }; tip.hide(this); e.preventDefault(); return; }
      if (z && z.t === 'axis') { this.ydrag = { y: e.clientY, z: this.yz || 1 }; tip.hide(this); e.preventDefault(); return; }
      this.drag = { x: e.clientX, r: this.view.r, moved: false }; cv.classList.add('drag'); tip.hide(this); e.preventDefault(); });
    window.addEventListener('mousemove', e => { if (this.pdrag) { this.paneDrag(e.clientY); return; } if (this.ydrag) { this.yz = clamp(this.ydrag.z * Math.exp((e.clientY - this.ydrag.y) * 0.006), 0.05, 20); this.requestDraw(); return; } if (!this.drag) return; const dx = e.clientX - this.drag.x; if (Math.abs(dx) > 1) this.drag.moved = true; this.view.r = this.drag.r - dx / this.g.barW; this.clampView(); this.changed(); });
    window.addEventListener('mouseup', () => { if (this.pdrag) { this.pdrag = null; store.set('paneh', PANEH); } if (this.ydrag) this.ydrag = null; if (this.drag) { this.drag = null; cv.classList.remove('drag'); this.requestDraw(); } });
    cv.addEventListener('mousemove', e => this.onMove(e));
    cv.addEventListener('mouseleave', () => { this.mouse = null; if (HUB.src === this) HUB.set(null, null); tip.hide(this); this.requestDraw(); });
    // çift tık: fiyat ekseninde → otomatik ölçek; panel sınırında → panel yükseklikleri varsayılana; grafikte → görünüm + ölçek sıfırlanır
    cv.addEventListener('dblclick', e => {
      const z = this.g && this.zone(e.offsetX, e.offsetY);
      if (z && z.t === 'axis') { this.yz = null; this.requestDraw(); return; }
      if (z && z.t === 'pane') { for (const k of Object.keys(PANEH)) delete PANEH[k]; store.set('paneh', PANEH); for (const ch of HUB.charts) ch.requestDraw(); return; }
      this.view = null; this.yz = null; this.requestDraw();
    });
  }
  // imlecin altındaki etkileşim bölgesi: panel sınırı (fiyat|panel ya da panel|panel) veya fiyat ekseni
  zone(x, y) {
    const g = this.g; if (!g) return null;
    if (g.PT) for (let k = 0; k < g.PT.length; k++) if (Math.abs(y - g.PT[k]) <= 4 && x < this.W) return { t: 'pane', k };
    if (x >= g.plotW && y < g.bot1 + 3) return { t: 'axis' };
    return null;
  }
  // sınır k'nin üstündeki ile altındaki panel arasında pay aktarılır; k = 0 ise fiyat alanıyla ilk panel arasında
  paneDrag(cy) {
    const D = this.pdrag, dy = cy - D.y, PH = D.PH.slice();
    if (D.k === 0) { const others = PH.reduce((a, b) => a + b, 0) - PH[0]; PH[0] = clamp(D.PH[0] - dy, PHMIN, Math.max(PHMIN, D.room - others)); }
    else { const tot = D.PH[D.k - 1] + D.PH[D.k], a = clamp(D.PH[D.k - 1] + dy, PHMIN, tot - PHMIN); PH[D.k - 1] = a; PH[D.k] = tot - a; }
    D.PL.forEach((key, i) => { PANEH[key] = Math.round(PH[i]); });
    for (const ch of HUB.charts) ch.requestDraw();
  }
  requestDraw() {
    if (!this.raf) this.raf = requestAnimationFrame(() => {
      this.raf = 0;
      if (this.sizeDirty) { this.sizeDirty = false; this.resize(); }
      if (this.indDirty) { this.indDirty = false; this.indicators?.setCandles(this.data, this.iv); }
      this.draw();
    });
  }
  requestResize() { this.sizeDirty = true; this.requestDraw(); }
  // canlı akış son mumu yerinde günceller: hesaplar bir sonraki çizimde (kare başına en çok bir kez) yeniden yapılır
  touchLast() { this.indDirty = true; this.requestDraw(); }
  resize() {
    const r = this.wrap.getBoundingClientRect(), dpr = window.devicePixelRatio || 1, W = Math.max(0, Math.floor(r.width)), H = Math.max(0, Math.floor(r.height));
    if (W === this.W && H === this.H && dpr === this.dpr) return;
    this.W = W; this.H = H; this.dpr = dpr; this.cv.width = Math.max(1, Math.round(W * dpr)); this.cv.height = Math.max(1, Math.round(H * dpr)); this.cv.style.width = W + 'px'; this.cv.style.height = H + 'px';
  }
  setData(rows, keep) {
    const old = this.data, ov = this.view; this.data = rows || []; this.aw = 0;
    this.indicators?.setCandles(this.data, this.iv);
    if (keep && ov && old.length && this.data.length) {
      if (this.follow) this.view = { w: ov.w, r: this.data.length + (ov.r - old.length) };
      else { const tR = old[clamp(Math.ceil(ov.r) - 1, 0, old.length - 1)][0], j = bsT(this.data, tR); this.view = { w: ov.w, r: Math.max(1, j + 1) + (ov.r - Math.ceil(ov.r)) }; }
      this.clampView();
    } else { this.view = null; this.follow = true; }
    this.requestDraw();
  }
  merge(rows) {
    const d = this.data; let added = 0, changed = false;
    for (const r of rows || []) {
      if (!d.length || r[0] > d[d.length - 1][0]) { d.push(r); added++; changed = true; }
      else {
        const i = bsT(d, r[0]);
        if (i >= 0 && d[i][0] === r[0] && (r.length !== d[i].length || r.some((value, j) => !Object.is(value, d[i][j])))) {
          d[i] = r; changed = true;
        }
      }
    }
    if (changed) this.indicators?.setCandles(d, this.iv);
    if (added && this.view && this.follow) this.view.r += added;
    this.requestDraw(); return added;
  }
  prepend(rows) {
    const d = this.data; if (!d.length) { this.setData(rows); return rows.length; }
    const add = (rows || []).filter(r => r[0] < d[0][0]); if (!add.length) return 0;
    this.data = add.concat(d); this.indicators?.setCandles(this.data, this.iv);
    if (this.view) this.view.r += add.length; this.requestDraw(); return add.length;
  }
  resetView(pw) { const n = this.data.length, w = Math.max(12, Math.min(Math.max(20, Math.round(pw / 5)), n + 3)); this.view = { w, r: n + 2 }; this.follow = true; }
  clampView() {
    const n = this.data.length, v = this.view; if (!v) return;
    v.w = clamp(v.w, 8, Math.max(60, Math.min(3000, n * 1.25)));
    v.r = clamp(v.r, Math.min(n, 4), n + v.w * 0.6);
  }
  changed() { const n = this.data.length; this.follow = this.view.r >= n - 0.5; this.requestDraw(); if (this.onView) this.onView(this); }
  onWheel(e) {
    e.preventDefault(); const g = this.g; if (!g || !this.data.length) return;
    const k = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? 400 : 1, dx = e.deltaX * k, dy = e.deltaY * k;
    if (Math.abs(dx) > Math.abs(dy)) { this.view.r += dx / g.barW; this.clampView(); this.changed(); return; }
    const mx = clamp(e.offsetX, 0, g.plotW), ci = g.L + mx / g.barW, ow = this.view.w;
    this.view.w = ow * Math.exp(clamp(dy, -300, 300) * 0.0015); this.clampView();
    this.view.r = ci + (this.view.r - ci) * this.view.w / ow; this.clampView(); this.changed();
  }
  onMove(e) {
    this.mouse = { x: e.offsetX, y: e.offsetY }; const g = this.g;
    { const z = this.pdrag ? { t: 'pane' } : this.ydrag ? { t: 'axis' } : this.drag ? null : this.zone(e.offsetX, e.offsetY), cur = z ? (z.t === 'pane' ? 'row-resize' : 'ns-resize') : '';

function bindMenu(button, menu, others) {   // others: aynı anda açık kalmaması gereken diğer menüler
  const b = $(button), m = $(menu);
  const show = open => { m.classList.toggle('open', open); b.setAttribute('aria-expanded', open); };
  b.onclick = e => { e.stopPropagation(); for (const x of [].concat(others)) { const om = $(x); if (!om) continue; om.classList.remove('open'); om.previousElementSibling?.setAttribute('aria-expanded', false); } show(!m.classList.contains('open')); };

function zInfo() { const z = S.zt; if (!S.cols || !S.cols.some(k => COLD[k] && COLD[k].z)) return ''; if (!z) return '<span class="zinfo">5 dk verisi bekleniyor…</span>'; const m = (z.at - z.since) / 60e3; return m < 5 ? `<span class="zinfo" title="5 dk sütunları sayfa açıldığından beri toplanıyor">5 dk verisi: ${Math.max(0, m).toFixed(0)}/5 dk</span>` : ''; }

// ---------- İzleme listesi: sütunlar (V1.15.0) ----------
// 24s sütunları ticker'dan (20 sn); 5 dk sütunları, funding ve tasfiye /api/t/tarama'dan (sunucu Binance akışlarından toplar, 5 sn'de bir sorulur).
const ZI = { m5: 0, b5: 1, v5: 2, fr: 3 };
const COLS = [
  { k: 'px', nm: 'Fiyat', w: 76, ds: 'son fiyat', v: (s, t) => t && t[0], f: v => fmtPx(v) },

  { k: 'vol', nm: 'Hacim', w: 46, ds: '24 saatlik hacim (USDT)', v: (s, t) => t && t[2], f: v => volM(v), c: () => 'mu' },
  { k: 'm5', nm: '5dk %', w: 54, ds: 'son 5 dakikadaki değişim', z: 1, f: v => fmtPct(v, 2), c: v => pcls(v) },
  { k: 'b5', nm: 'Alış 5dk', w: 54, ds: 'son 5 dk piyasa ALIŞ payı (≥55 alıcı, ≤45 satıcı baskın)', z: 1, f: v => '%' + v.toFixed(0), c: v => v >= 55 ? 'up' : v <= 45 ? 'dn' : '' },
  { k: 'v5', nm: 'Hacim 5dk', w: 54, ds: 'son 5 dakikanın hacmi', z: 1, f: v => volM(v), c: () => 'mu' },
  { k: 'fr', nm: 'Funding', w: 64, ds: 'anlık tahmini funding', z: 1, f: v => fmtPct(v, 3), c: v => Math.abs(v) >= 0.1 ? (v > 0 ? 'up hl' : 'dn hl') : pcls(v) },
  { k: 'lq', nm: 'Tasfiye 1s', w: 56, ds: 'son 1 saatte tasfiye (long + short; Binance saniyede ≤1 bildirir, alt sınır)', z: 1, f: v => v ? volM(v) : '—', c: () => 'mu' },
];
const COLD = Object.fromEntries(COLS.map(c => [c.k, c]));
function val(s, k) {
  const c = COLD[k], t = S.tick && S.tick[s]; if (!c) return null;
  if (!c.z) { const v = c.v(s, t); return v == null || !isFinite(v) ? null : v; }

}
function cell(s, k) {
  const c = COLD[k], v = val(s, k); let tip = '';
  if (k === 'lq') { const r = S.zt && S.zt.rows && S.zt.rows[s]; if (r && (r[4] || r[5])) tip = ` title="long ${volM(r[4])} · short ${volM(r[5])}"`; }
  if (k === 'b5') { const r = S.zt && S.zt.rows && S.zt.rows[s]; if (r && r[2]) tip = ` title="5 dk hacim ${volM(r[2])}"`; }
  return `<span class="n ${v == null ? 'mu' : c.c ? c.c(v) : ''}" data-c="${k}"${tip}>${v == null ? '—' : c.f(v)}</span>`;
}
function applyCols() {
  const cs = S.cols.map(k => COLD[k]).filter(Boolean), w = cs.reduce((a, c) => a + c.w, 0);
  document.documentElement.style.setProperty('--cols', ['minmax(52px,1fr)'].concat(cs.map(c => c.w + 'px'), ['16px']).join(' '));
  // sağ panel genişliği ayraçla ayarlanır (workspace.js); ayraç hiç sürüklenmediyse varsayılan seçili sütunlara sığacak kadar olur
  $('#workspace')?.style.setProperty('--sidebar-default', Math.max(324, Math.min(480, w + 52 + 16 + 64)) + 'px');
  $('#colm').innerHTML = COLS.map(c => `<label title="${esc(c.ds)}"><input type="checkbox" data-col="${c.k}" ${S.cols.includes(c.k) ? 'checked' : ''}> ${c.nm}<small>${c.ds.split(' (')[0]}</small></label>`).join('') + '<div class="ddf"><button data-cdef="1">Varsayılan</button></div>';
  for (const c of HUB.charts) c.requestResize();
  if (S.cols.some(k => COLD[k].z)) TASKS.zt.next = 0;
}
function sortRows(arr, all) {
  const k = S.sort.k || (all ? 'chg' : null), dir = S.sort.k ? S.sort.dir : -1; if (!k) return arr;
  return arr.sort((a, b) => { if (k === 'sym') return (a.s < b.s ? -1 : 1) * dir; const va = val(a.s, k), vb = val(b.s, k); if (va == null && vb == null) return a.i - b.i; if (va == null) return 1; if (vb == null) return -1; return (va - vb) * dir || a.i - b.i; });
}
$('#wl').addEventListener('click', e => {
  const st = e.target.closest('[data-star]'); if (st) { e.stopPropagation(); listAct(S.list.includes(st.dataset.star) ? 'sil' : 'ekle', st.dataset.star); return; }
  const x = e.target.closest('[data-x]'); if (x) { e.stopPropagation(); listAct('sil', x.dataset.x); return; }
  const a = e.target.closest('[data-add]'); if (a) { e.stopPropagation(); listAct('ekle', a.dataset.add); return; }
  const r = e.target.closest('[data-s]'); if (r && r.dataset.s !== S.sym) select(r.dataset.s);
});
$('#lh').addEventListener('click', ev => { const e = ev.target.closest('[data-sort]'); if (!e) return;
  const k = e.dataset.sort, first = k === 'sym' ? 1 : -1, all = S.mode === 'all';
  if (!S.sort.k && all && k === 'chg') { S.sort = { k, dir: 1 }; renderList(); return; }
  if (S.sort.k !== k) S.sort = { k, dir: first }; else if (S.sort.dir === first) S.sort.dir = -first; else S.sort = { k: null, dir: 1 };
  renderList();
});
async function listAct(action, sym) {
  $('#aerr').textContent = '';
  try { S.list = await api('/api/t/izleme', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ action, symbol: sym }) }); S.listErr = ''; S.listOk = true; renderList(); return true; }
  catch (e) { $('#aerr').textContent = (action === 'ekle' ? 'Eklenemedi: ' : 'Çıkarılamadı: ') + e.message; return false; }
}
document.querySelectorAll('.modes [data-mode]').forEach(b => b.onclick = () => { S.mode = b.dataset.mode; store.set('mode', S.mode); S.filt = ''; S.dlOnly = false; $('#addq').value = ''; $('#sugg').classList.remove('open'); $('#wl').scrollTop = 0; renderList(); });
$('#linfo').addEventListener('click', e => { if (e.target.closest('#dlchip')) { S.dlOnly = !S.dlOnly; $('#wl').scrollTop = 0; renderList(); } });
// coin ekle kutusu ("Tümü" kipinde arama kutusu olarak çalışır)
const A = { items: [], sel: 0 };
function suggest() {
  const q = String($('#addq').value || '').toUpperCase().replace(/[^A-Z0-9]/g, ''), box = $('#sugg');
  if (S.mode === 'all') { box.classList.remove('open'); A.items = []; if (S.filt !== q) { S.filt = q; $('#wl').scrollTop = 0; renderList(); } return; }
  if (!q) { box.classList.remove('open'); A.items = []; return; }
  if (!S.tick) { A.items = []; box.innerHTML = `<div class="nt">${S.tickErr ? 'Sembol listesi alınamadı' : 'Sembol listesi yükleniyor…'} — Enter ile ${esc(q.endsWith('USDT') ? q : q + 'USDT')} denenir</div>`; box.classList.add('open'); return; }
  const keys = Object.keys(S.tick), qq = q.endsWith('USDT') && q.length > 4 ? q.slice(0, -4) : q;
  const pre = keys.filter(s => short(s).startsWith(qq)).sort((a, b) => a.length - b.length || a.localeCompare(b)), inc = keys.filter(s => !short(s).startsWith(qq) && s.includes(qq)).sort();
  A.items = pre.concat(inc).slice(0, 8); A.sel = 0;
  box.innerHTML = A.items.length ? A.items.map((s, i) => `<div data-i="${i}" class="${i === A.sel ? 'on' : ''}"><b>${esc(short(s))}</b><span style="color:var(--mut)">USDT</span><small>${S.list.includes(s) ? 'listede' : '$' + fmtBig(S.tick[s][2])}</small></div>`).join('') : '<div class="nt">Eşleşen Binance vadeli USDT sembolü yok</div>';
  box.classList.add('open');
}
async function addPick(s) {
  if (!s) return; $('#sugg').classList.remove('open'); $('#addq').value = ''; A.items = [];
  if (S.list.includes(s)) { select(s); return; }
  if (await listAct('ekle', s)) select(s);
}
$('#addq').addEventListener('input', suggest);
$('#addq').addEventListener('focus', suggest);
$('#addq').addEventListener('blur', () => setTimeout(() => $('#sugg').classList.remove('open'), 150));
$('#addq').addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { if (!A.items.length) return; e.preventDefault(); A.sel = (A.sel + (e.key === 'ArrowDown' ? 1 : -1) + A.items.length) % A.items.length; document.querySelectorAll('#sugg [data-i]').forEach(d => d.classList.toggle('on', +d.dataset.i === A.sel)); }
  else if (e.key === 'Enter' && S.mode === 'all') { e.preventDefault(); if (S.shown[0]) select(S.shown[0]); }
  else if (e.key === 'Escape' && S.mode === 'all') { $('#addq').value = ''; suggest(); }
  else if (e.key === 'Enter') { e.preventDefault(); const q = cleanSym($('#addq').value); addPick(A.items[A.sel] || (q ? (q.endsWith('USDT') ? q : q + 'USDT') : null)); }
  else if (e.key === 'Escape') { $('#addq').value = ''; $('#sugg').classList.remove('open'); }
});
$('#sugg').addEventListener('mousedown', e => { const d = e.target.closest('[data-i]'); if (d) { e.preventDefault(); addPick(A.items[+d.dataset.i]); } });

// ---------- Coin seçimi ve yoklama ----------
let signalPanel = null;
function mountSignals() {
  const root = $('#signal-panel'), panel = globalThis.TerminalSignalPanel;
  if (root && typeof panel?.mount === 'function') {
    signalPanel = panel.mount({ root, api, getSymbol: () => S.sym, onSelectSymbol: select });
  }
}
function select(sym) {
  sym = cleanSym(sym); { const cc = $('#coin-card'); if (sym && cc && !cc.open) cc.open = true; }
  if (!sym || sym === S.sym) return;
  S.sym = sym; S.gen++; store.set('sym', sym); S.coin = null; S.coinErr = ''; S.sigs = []; S.oiRows = [];
  document.title = `${short(sym)} · Botlar Terminal`;
  S.son = null; S.frIv = null; S.ob = null; for (const p of P) { p.gen++; p.loaded = false; p.busy = false; p.tbusy = false; p.next = 0; p.tnext = 0; p.ch.ext = null; p.ch.predFr = null; p.ch.err = ''; p.ch.msg = 'Yükleniyor…'; p.ch.signals = []; p.ch.setData([]); }
  OI.err = ''; OI.msg = 'Yükleniyor…'; OI.setData([]); S.oiGen++;
  TASKS.coin.next = TASKS.oi.next = TASKS.sig.next = TASKS.ob.next = 0;
  S.livePx = null; S.liveAt = 0; S.flow = []; S.flowSince = 0; S.big = []; S.liqC = []; S.oiHist = []; S.tapeAt = 0; S.liqFull = false; openLive(); loadAkis();
  renderList(); renderSum(); renderOiStats(); renderOz(); loop();
  signalPanel?.setSymbol(sym);
}
async function checkVer() { try { const v = await api('/api/version'); $('#ver').textContent = 'V' + v.version; if (S.stamp && S.stamp !== v.stamp) location.reload(); S.stamp = v.stamp; } catch (e) { } }
// Binance'e giden yoklamalar sınır beklemesinde ve sekme gizliyken durur; yerel uçlar (sinyal, sürüm) yalnız sekme gizliyken durur.
const TASKS = { coin: { ms: 10e3, fn: loadCoin, next: 0 }, tick: { ms: 20e3, fn: loadTickers, next: 0 }, oi: { ms: 60e3, fn: loadOi, next: 0 }, uni: { ms: 300e3, fn: loadUni, next: 0 }, ob: { ms: 15e3, fn: loadOb, next: 0 }, zt: { ms: 5e3, fn: loadZt, next: 0, local: true }, btc: { ms: 60e3, fn: loadBtc, next: 0 }, sig: { ms: 30e3, fn: loadSigs, next: 0, local: true }, ver: { ms: 10e3, fn: checkVer, next: 0, local: true }, list: { ms: 60e3, fn: loadList, next: 0, local: true } };
function loop() {
  { const lv = $('#lv'); if (lv && lv.classList.contains('on') !== (Date.now() - S.liveAt < 10e3)) { renderSum(); renderOz(); } }
  { const ti = $('#tapeIn'); if (ti && !document.hidden && (!ti.innerHTML || Date.now() - S.tapeAt > 120e3)) renderTape(); }
  renderWarn(); const cd = $('#cd'); if (cd) cd.textContent = cdText(S.coin && S.coin.nextFunding); const cd2 = $('#cd2'); if (cd2) cd2.textContent = cdText(S.coin && S.coin.nextFunding);
  if (document.hidden) return;
  const now = Date.now(), pz = paused();
  for (const t of Object.values(TASKS)) if (now >= t.next && !t.busy && (t.local || !pz)) { t.next = now + t.ms; t.busy = true; Promise.resolve().then(t.fn).catch(() => { }).finally(() => { t.busy = false; }); }
  if (!S.sym) return;
  const derivativePanes = needTurev(), summary = pz || derivativePanes ? null : summaryTurevPane();
  for (const p of P) {
    if (pz) { if (!p.loaded && !p.busy) { p.ch.msg = 'Binance sınırı nedeniyle bekleniyor…'; p.ch.requestDraw(); } continue; }
    if (p.loaded && (derivativePanes || p === summary) && now >= p.tnext && !p.tbusy) loadTurev(p);
    if (p.busy || now < p.next) continue;
    p.next = now + (now - S.liveAt < 10e3 ? 15000 : 5000); if (p.loaded) chartLive(p); else chartFull(p);
  }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) { for (const t of Object.values(TASKS)) t.next = 0; for (const p of P) p.next = 0; openLive(); loop(); } else if (S.es) { S.es.close(); S.es = null; S.liveAt = 0; } });
window.addEventListener('resize', () => { for (const c of HUB.charts) c.requestResize(); });

// ---------- Açılış ----------

$('#coin-card').addEventListener('toggle', () => { if ($('#coin-card').open) { renderOz(); loop(); } });

(async () => {
  let qs = null; try { qs = cleanSym(new URLSearchParams(location.search).get('s')); if (location.search) history.replaceState(null, '', location.pathname); } catch (e) { }

  if (!S.sym) select(S.list[0] || 'BTCUSDT');
  setInterval(loop, 1000); loop();
})();
